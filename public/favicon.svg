<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#1B5E20"/>
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer boundary polygon -->
    <polygon points="120,180 392,112 432,360 152,410" fill="#246B2A" fill-opacity="0.4"/>
    <!-- Diagonal triangulation line -->
    <line x1="120" y1="180" x2="432" y2="360"/>
  </g>
  <!-- Vertex Circles (Surveyor Pins) -->
  <g fill="#1B5E20" stroke="#FFFFFF" stroke-width="20">
    <circle cx="120" cy="180" r="32"/>
    <circle cx="392" cy="112" r="32"/>
    <circle cx="432" cy="360" r="32"/>
    <circle cx="152" cy="410" r="32"/>
  </g>
</svg>
